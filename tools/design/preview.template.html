<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIAP — Design walkthrough</title>
<style>
:root{--ink:#102d46;--muted:#536779;--brand:#086c65;--bg:#f3f6f8;--line:#dce4e9;--tint:#e9f4f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,Segoe UI,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #dc9c24;outline-offset:4px}.review{background:#102d46;color:white;padding:12px 4%;display:flex;align-items:center;gap:18px;font-size:12px;flex-wrap:wrap}.review strong{margin-right:auto}.review button{border:1px solid #537184;color:white;background:transparent;padding:5px 12px;border-radius:5px}.review button[aria-pressed=true]{background:white;color:#102d46}.demo{text-align:center;background:#fff4d9;color:#745417;font-size:12px;padding:8px}header{background:#fff;border-bottom:1px solid var(--line);padding:22px 5%;display:flex;align-items:center;gap:30px}a{text-decoration:none;color:inherit}nav{display:flex;gap:26px;margin-left:auto;font-size:13px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:12px}.mark{background:var(--brand);color:white;width:36px;height:38px;display:grid;place-items:center;border-radius:12px 12px 16px 16px;font-size:20px}.subbrand{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:500}.container{max-width:1200px;margin:auto;padding:56px 30px 70px}.crumb{font-size:12px;color:var(--muted);margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:750;color:var(--brand)}h1{font-size:40px;line-height:1.16;letter-spacing:-1.6px;max-width:770px;margin:18px 0}p.lead{color:var(--muted);max-width:710px;font-size:17px;margin:0 0 32px}.home h1{font-size:64px;max-width:690px}.home .lead{font-size:19px;max-width:620px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:34px;align-items:start}.main-card{background:white;padding:32px;border:1px solid var(--line);border-radius:16px}.side{border-left:3px solid var(--brand);padding:12px 0 12px 22px;color:var(--muted);font-size:13px}.side strong{color:var(--ink);font-size:15px}.side p{margin:12px 0 22px}.cards{display:grid;gap:14px}.card{padding:20px;border:1px solid var(--line);border-radius:10px;background:white}.card h2{font-size:15px;margin:0 0 8px}.card p{font-size:14px;color:var(--muted);margin:0;white-space:pre-line}.home .cards{grid-template-columns:repeat(3,1fr);margin-top:32px}.home .main-card{background:transparent;padding:0;border:0}.home .layout{display:block}.home .side{display:none}.field{margin-bottom:20px}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.input{padding:13px 15px;border:1px solid #c9d5dd;border-radius:8px;background:#fafcfd;color:#596d7b;font-size:14px;min-height:49px}.field.long .input{min-height:104px}.notice{padding:15px 18px;background:#fff7e4;border-radius:8px;color:#71551c;font-size:13px;margin-top:22px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.actions a{border:1px solid var(--line);background:white;font-size:13px;font-weight:650;border-radius:8px;padding:12px 18px;min-height:46px}.actions a:first-child{background:var(--brand);border-color:var(--brand);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:var(--tint);padding:21px;border-radius:10px}.stat strong{display:block;font-size:29px;line-height:1.2}.stat span{font-size:11px;color:var(--muted)}footer{padding:24px 5%;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.wire{--ink:#292929;--muted:#666;--brand:#555;--bg:#f4f4f4;--line:#ccc;--tint:#eee}.wire .main-card,.wire .card,.wire .actions a,.wire .input,.wire .stat{border-radius:0}.wire .mark,.wire .notice{background:#ddd;color:#333;border-radius:0}.wire .demo{background:#eee;color:#555}.wire h1{font-size:36px;letter-spacing:0}.wire .home h1{font-size:48px}.mobile #canvas{max-width:390px;margin:24px auto;background:var(--bg);box-shadow:0 0 0 1px #ccd7de}.mobile header{padding:16px}.mobile nav{display:none}.mobile .container{padding:28px 18px}.mobile .layout{display:block}.mobile .side{display:none}.mobile h1,.mobile .home h1{font-size:34px;letter-spacing:-1px}.mobile .lead{font-size:15px}.mobile .main-card{padding:20px}.mobile .home .main-card{padding:0}.mobile .home .cards{grid-template-columns:1fr}.mobile .stats{grid-template-columns:1fr 1fr}.mobile .actions{display:grid}.mobile footer{display:block;padding:20px}.mobile .demo{font-size:10px}@media(max-width:700px){nav{display:none}.container{padding:28px 18px}.layout{display:block}.side{display:none}h1,.home h1{font-size:36px}.home .cards{grid-template-columns:1fr}.main-card{padding:20px}.stats{grid-template-columns:1fr 1fr}.review{gap:8px}.actions{display:grid}footer{display:block}}
select{max-width:100%;min-width:0;padding:7px;border-radius:4px}.mobile #canvas{width:100%}.review select{width:280px}
</style>
<div class="review"><strong>SIAP / DESIGN REVIEW · klik tombol untuk walkthrough</strong><button id="mock" aria-pressed="true">Mock-up</button><button id="wire" aria-pressed="false">Wireframe</button><button id="mobile" aria-pressed="false">Mobile 390</button><select id="screen" aria-label="Pilih layar"></select></div><div id="canvas"><div class="demo">PROTOTYPE LOMBA · Data contoh · Tidak menerima laporan sungguhan</div><header><a href="#home" class="brand"><span class="mark">S</span><span>SIAP<div class="subbrand">SISTEM INFORMASI ADUAN PUBLIK</div></span></a><nav><a href="#home">Beranda</a><a href="#transparansi">Transparansi</a><a href="#panduan">Panduan & privasi</a><a href="#cek">Cek status →</a></nav></header><main id="main"></main><footer><span>SIAP · Lapor aman, pantau sampai tuntas.</span><a href="#login">Akses petugas →</a></footer></div>
<script>const screens=__SCREENS__;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let mode='mock';const select=document.querySelector('#screen');select.innerHTML=screens.map(s=>`<option value="${s.id}">${s.id} — ${esc(s.title)}</option>`).join('');select.onchange=()=>location.hash=select.value;function render(){let id=location.hash.slice(1)||'home',s=screens.find(s=>s.id===id)||screens[0];select.value=s.id;document.querySelector('#main').className=s.id==='home'?'home':'';document.querySelector('#main').innerHTML=`<div class="container"><div class="crumb">SIAP / ${esc(s.eyebrow.toLowerCase())}</div><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.intro)}</p><div class="layout"><div class="main-card">${s.stats?`<div class="stats">${s.stats.map(([a,b])=>`<div class="stat"><strong>${esc(a)}</strong><span>${esc(b)}</span></div>`).join('')}</div>`:''}${(s.fields||[]).map(([a,b])=>`<div class="field ${a.includes('Kronologi')||a.includes('Ringkasan')?'long':''}"><label>${esc(a)}</label><div class="input">${esc(b)}</div></div>`).join('')}<div class="cards">${(s.cards||[]).map(([a,b])=>`<article class="card"><h2>${esc(a)}</h2><p>${esc(b)}</p></article>`).join('')}</div>${s.note?`<div class="notice">${esc(s.note)}</div>`:''}<div class="actions">${s.actions.map(([a,b])=>`<a href="#${b}">${esc(a)} →</a>`).join('')}</div></div><aside class="side"><strong>Pelaporan yang tertib.</strong><p>01 · Sampaikan fakta<br>02 · Sertakan bukti<br>03 · Simpan akses tiket<br>04 · Pantau tanggapan</p><strong>Identitas Anda berharga.</strong><p>Hindari informasi pribadi dalam kronologi dan bukti. Isi laporan tidak ditampilkan di dashboard publik.</p><a href="#panduan">Baca panduan →</a></aside></div></div>`;window.scrollTo(0,0)}window.onhashchange=render;document.querySelector('#wire').onclick=()=>{document.body.classList.add('wire');document.querySelector('#wire').setAttribute('aria-pressed','true');document.querySelector('#mock').setAttribute('aria-pressed','false')};document.querySelector('#mock').onclick=()=>{document.body.classList.remove('wire');document.querySelector('#wire').setAttribute('aria-pressed','false');document.querySelector('#mock').setAttribute('aria-pressed','true')};document.querySelector('#mobile').onclick=e=>{document.body.classList.toggle('mobile');e.target.setAttribute('aria-pressed',document.body.classList.contains('mobile'))};render();</script></html>
